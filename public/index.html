<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WILD SURVIVAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bs:1;--acc:#7ed957;--acc2:#ffb648;--txt:#f6f2e6;--mut:#b9c4b2;--pan:rgba(22,32,25,.92);--line:rgba(255,255,255,.13)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1410;color:var(--txt);font-family:'Fredoka',system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#root{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}
body.rot #root{transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.pa{pointer-events:auto}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;font-size:inherit}
.hidden{display:none!important}
/* loading */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#24452f,#07100b);z-index:60}
#loading h1,.logo{font-weight:700;line-height:.92;color:#ffe08a;text-shadow:0 5px 0 #7a4512,0 12px 30px rgba(0,0,0,.6);margin:0}
#loading h1{font-size:clamp(36px,calc(var(--vw,1vw)*8),72px);text-align:center}
#loading p{color:var(--mut);margin:14px 0 0}
.bar{width:min(320px,calc(var(--vw,1vw)*70));height:10px;background:#0007;border-radius:6px;overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ed957,#ffd84a);transition:width .25s}
/* menu */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:20px 20px 20px max(calc(var(--vw,1vw)*7),env(safe-area-inset-left));background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.05) 65%);z-index:10;pointer-events:auto}
.logo{font-size:clamp(40px,calc(var(--vw,1vw)*8.5),92px);margin-bottom:10px;animation:float 4s ease-in-out infinite}
.logo small{display:block;font-size:.26em;color:#c4f7a0;letter-spacing:.35em;text-shadow:0 2px 0 #1e4d12;margin-top:8px}
@keyframes float{50%{transform:translateY(-6px)}}
.mbtn{display:flex;align-items:center;gap:12px;width:min(310px,calc(var(--vw,1vw)*78));margin:6px 0;padding:12px 20px;font-size:clamp(17px,calc(var(--vw,1vw)*2.3),21px);font-weight:600;letter-spacing:.06em;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05));border:2px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .16s,background .16s,border-color .16s,box-shadow .16s;animation:slidein .55s backwards;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.mbtn:nth-child(2){animation-delay:.05s}.mbtn:nth-child(3){animation-delay:.1s}.mbtn:nth-child(4){animation-delay:.15s}.mbtn:nth-child(5){animation-delay:.2s}.mbtn:nth-child(6){animation-delay:.25s}.mbtn:nth-child(7){animation-delay:.3s}
.mbtn:hover,.mbtn:focus-visible{transform:translateX(10px) scale(1.03);background:linear-gradient(180deg,#90e56b,#47a836);border-color:#d4ffb6;box-shadow:0 8px 26px rgba(126,217,87,.35)}
.mbtn:active{transform:scale(.97)}
.mbtn.main{background:linear-gradient(180deg,#ffd24d,#f08a18);border-color:#ffe9a8;color:#3a1d00}
.mbtn:disabled{opacity:.42;transform:none;box-shadow:none}
.mbtn .ic{width:26px;text-align:center}
@keyframes slidein{from{opacity:0;transform:translateX(-40px)}}
#menuNote{position:fixed;right:14px;bottom:max(10px,env(safe-area-inset-bottom));font-size:12px;color:#ffffffaa;z-index:11}
@media (orientation:portrait) and (max-width:700px){body:not(.rot) #menu{align-items:center;padding-left:20px;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.15))}body:not(.rot) .logo{text-align:center}}
body.sh #menu{flex-direction:row;align-items:center;justify-content:center;gap:6%;padding-left:20px}
body.sh .logo{font-size:46px;text-align:left}
body.sh .mbtn{padding:7px 16px;margin:4px 0;font-size:16px;width:250px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#statsBox{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));width:min(210px,calc(var(--vw,1vw)*38));background:rgba(10,18,12,.55);border:1px solid var(--line);border-radius:12px;padding:7px 9px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.st{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}
.st b{width:16px;text-align:center;font-size:13px}
.st .tr{flex:1;height:9px;background:#0008;border-radius:5px;overflow:hidden}
.st .tr i{display:block;height:100%;border-radius:5px;transition:width .2s}
.st.low .tr i{animation:blink .8s infinite}
@keyframes blink{50%{opacity:.35}}
#lvlRow{display:flex;align-items:center;gap:7px;margin-top:5px}
#lvlBadge{background:linear-gradient(180deg,#ffd24d,#f08a18);color:#3a1d00;font-weight:700;font-size:12px;border-radius:8px;padding:1px 7px;white-space:nowrap}
#xpTr{flex:1;height:7px;background:#0008;border-radius:4px;overflow:hidden}
#xpTr i{display:block;height:100%;background:linear-gradient(90deg,#8be8ff,#5b8cff);width:0}
#questBox{margin-top:7px;font-size:12px;line-height:1.25;color:#fff;border-top:1px solid var(--line);padding-top:6px;pointer-events:auto;cursor:pointer}
#questBox .qh{color:#ffe08a;font-weight:600}
#topC{position:absolute;left:50%;transform:translateX(-50%);top:max(10px,env(safe-area-inset-top));background:rgba(10,18,12,.55);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:14px;display:flex;gap:9px;align-items:center;white-space:nowrap}
#topC #biomeL{color:var(--mut);font-size:12px}
#topR{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:118px;height:118px;border-radius:50%;border:3px solid rgba(255,255,255,.55);box-shadow:0 4px 14px #0007;background:#123;pointer-events:auto;cursor:pointer}
.tbtns{display:flex;gap:6px}
.hb{width:42px;height:42px;border-radius:12px;background:rgba(10,18,12,.6);border:1px solid rgba(255,255,255,.25);font-size:20px;pointer-events:auto;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px #0006}
.hb:active{transform:scale(.92)}
#hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:5px;pointer-events:auto}
.slot{position:relative;width:52px;height:52px;border-radius:11px;background:rgba(14,22,16,.72);border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:27px;cursor:pointer}
.slot.sel{border-color:#ffe08a;box-shadow:0 0 0 2px #ffe08a66,0 0 14px #ffd24d66;transform:translateY(-3px)}
.slot .n{position:absolute;right:4px;bottom:1px;font-size:12px;font-weight:600;text-shadow:0 1px 2px #000}
.slot .k{position:absolute;left:4px;top:1px;font-size:10px;color:#ffffff99}
.slot .du{position:absolute;left:5px;right:5px;bottom:4px;height:3px;background:#0009;border-radius:2px}
.slot .du i{display:block;height:100%;background:#7ed957;border-radius:2px}
.slot .rb{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:0 0 9px 9px}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 70px);background:rgba(10,18,12,.75);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:6px 14px;font-size:15px;white-space:nowrap}
#prompt kbd{background:#ffe08a;color:#3a1d00;border-radius:5px;padding:0 6px;font-family:inherit;font-weight:700;margin-right:6px}
#toasts{position:absolute;right:max(12px,env(safe-area-inset-right));top:190px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;max-width:calc(var(--vw,1vw)*60)}
.toast{background:rgba(10,18,12,.8);border-left:4px solid #7ed957;border-radius:8px;padding:5px 10px;font-size:13px;animation:tin .25s,tout .5s 2.6s forwards}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;font-size:clamp(20px,calc(var(--vw,1vw)*4),34px);font-weight:700;color:#ffe08a;text-shadow:0 3px 0 #6b3d10,0 6px 20px #000;opacity:0;transition:opacity .4s;white-space:nowrap}
#banner small{display:block;font-size:.5em;color:#fff;font-weight:500}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(255,0,0,0);transition:box-shadow .3s}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:40}
#craftProg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 108px);width:220px;background:rgba(10,18,12,.8);border-radius:10px;padding:5px 9px;font-size:12px;text-align:center}
#craftProg .tr{height:7px;background:#0008;border-radius:4px;margin-top:4px;overflow:hidden}
#craftProg .tr i{display:block;height:100%;background:#ffb648;width:0}
#tut{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 42px);width:min(460px,calc(var(--vw,1vw)*56));background:rgba(255,224,138,.95);color:#2e1a00;border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.3;pointer-events:auto;box-shadow:0 6px 20px #0006}
#tut b{display:block;font-size:14px}
#tut button{float:right;margin:0 0 4px 8px;background:#2e1a00;color:#ffe08a;border-radius:8px;padding:3px 9px;font-size:12px}
#buildBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 66px);display:flex;gap:8px;pointer-events:auto;align-items:center;background:rgba(10,18,12,.75);border-radius:14px;padding:6px 10px;border:1px solid var(--line)}
#buildBar .bn{font-size:13px;max-width:150px;color:#ffe08a}
.bb{background:#ffffff22;border:1px solid #ffffff44;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.bb.ok{background:#4caf3a}.bb.no{background:#b33b2e}
/* touch */
#touch{position:absolute;inset:0;pointer-events:none}
body:not(.touch) #touch{display:none}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 4px);width:calc(130px*var(--bs));height:calc(130px*var(--bs));border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 2px 10px #0006}
#abtns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 4px);width:calc(200px*var(--bs));height:calc(190px*var(--bs));pointer-events:none}
.tb{position:absolute;border-radius:50%;background:rgba(15,25,18,.55);border:2px solid rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;font-size:calc(22px*var(--bs));box-shadow:0 3px 12px #0006;line-height:1}
.tb small{font-size:calc(9px*var(--bs));margin-top:2px;opacity:.85}
.tb.on{background:rgba(126,217,87,.6)}
.tb:active{transform:scale(.92)}
#tUse{width:calc(80px*var(--bs));height:calc(80px*var(--bs));right:0;bottom:0;font-size:calc(30px*var(--bs));background:rgba(240,138,24,.55)}
#tJump{width:calc(60px*var(--bs));height:calc(60px*var(--bs));right:calc(92px*var(--bs));bottom:0}
#tInt{width:calc(60px*var(--bs));height:calc(60px*var(--bs));right:calc(10px*var(--bs));bottom:calc(92px*var(--bs))}
#tSprint{width:calc(52px*var(--bs));height:calc(52px*var(--bs));right:calc(86px*var(--bs));bottom:calc(74px*var(--bs))}
#tInv{width:calc(48px*var(--bs));height:calc(48px*var(--bs));right:calc(150px*var(--bs));bottom:calc(64px*var(--bs))}
body.touch #hotbar .slot{width:46px;height:46px;font-size:23px}
body.touch #prompt{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 64px)}
@media (max-width:820px){body.touch #hotbar{bottom:max(6px,env(safe-area-inset-bottom))}body.touch #hotbar .slot{width:40px;height:40px;font-size:20px;border-radius:9px}}
@media (orientation:portrait) and (max-width:700px){
body:not(.rot).touch #joy,body:not(.rot).touch #abtns{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 62px)}
body:not(.rot).touch #prompt{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 270px)}
body:not(.rot) #statsBox{width:calc(var(--vw,1vw)*44)}
body:not(.rot) #tut{top:auto;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 300px);width:calc(var(--vw,1vw)*88)}
body:not(.rot) #topC{top:auto;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 236px)}
body:not(.rot) #mini{width:92px;height:92px}
body:not(.rot) #toasts{top:170px}
body:not(.rot) #buildBar{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 236px)}
body:not(.rot) #craftProg{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 236px)}}
@media (max-height:430px){body:not(.rot) #statsBox{width:180px;padding:5px 7px}body:not(.rot) .st{margin:1px 0;font-size:11px}body:not(.rot) #mini{width:84px;height:84px}body:not(.rot) .hb{width:36px;height:36px;font-size:17px}body:not(.rot) #toasts{top:140px}body:not(.rot) #tut{top:44px;font-size:12px}}
body.rot.sh #statsBox{width:180px;padding:5px 7px}body.rot.sh .st{margin:1px 0;font-size:11px}body.rot.sh #mini{width:84px;height:84px}body.rot.sh .hb{width:36px;height:36px;font-size:17px}body.rot.sh #toasts{top:140px}body.rot.sh #tut{top:44px;font-size:12px}
/* panels */
#panel{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;pointer-events:auto;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.box{width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--pan);border:2px solid rgba(255,255,255,.15);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden;animation:pop .2s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.box .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border-bottom:1px solid var(--line)}
.box .hd h2{margin:0;font-size:20px;color:#ffe08a}
.box .x{width:38px;height:38px;border-radius:10px;background:#ffffff1a;font-size:20px}
.box .bd{padding:12px 14px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:7px 12px;border-radius:10px;background:#ffffff14;border:1px solid #ffffff22;font-size:14px}
.tab.on{background:#7ed957;color:#10240a;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.grid .slot{width:auto;aspect-ratio:1;height:auto}
.grid .slot.hot{background:rgba(60,48,14,.7)}
.grid .slot.mv{outline:3px dashed #8be8ff}
.det{margin-top:10px;background:#00000033;border-radius:12px;padding:10px;min-height:70px;font-size:14px}
.det h3{margin:0 0 3px;font-size:17px}
.det p{margin:3px 0;color:var(--mut)}
.btn{background:#7ed957;color:#10240a;font-weight:600;border-radius:10px;padding:8px 14px;margin:6px 6px 0 0;font-size:14px}
.btn.alt{background:#ffffff22;color:#fff}
.btn.warn{background:#e0573f;color:#fff}
.btn:disabled{opacity:.4}
.rc{display:flex;gap:10px;align-items:center;background:#00000030;border-radius:12px;padding:8px 10px;margin-bottom:7px;border:1px solid transparent}
.rc .ri{font-size:30px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:#ffffff12;border-radius:10px;flex:none}
.rc .rt{flex:1;min-width:0;font-size:13px}
.rc .rt b{font-size:15px}
.rc .mats span{display:inline-block;margin:2px 6px 0 0;padding:1px 6px;border-radius:6px;background:#ffffff12}
.rc .mats .ok{color:#a8f08a}.rc .mats .no{color:#ff8f7a}
.rc.lock{opacity:.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row input[type=range]{width:min(220px,calc(var(--vw,1vw)*45))}
.row select{background:#ffffff1a;color:#fff;border:1px solid #ffffff33;border-radius:8px;padding:5px;font-family:inherit}
.row select option{color:#000}
.kb{min-width:90px;background:#ffffff1a;border:1px solid #ffffff33;border-radius:8px;padding:5px 8px;font-size:13px}
.kb.wait{background:#ffb648;color:#000}
.sw{display:inline-block;width:32px;height:32px;border-radius:50%;margin:3px;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:#ffe08a}
.opt{display:inline-block;padding:6px 10px;margin:3px;border-radius:9px;background:#ffffff14;border:1px solid #ffffff22;font-size:13px}
.opt.on{background:#7ed957;color:#10240a}
.opt.lk{opacity:.45}
#mapC{width:100%;max-width:640px;aspect-ratio:1;display:block;margin:0 auto;border-radius:12px;background:#0b1410;touch-action:none}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:12px;color:var(--mut);margin-top:8px}
.note{background:#f3e7c4;color:#3b2a10;border-radius:10px;padding:14px;font-size:15px;line-height:1.5;font-family:Georgia,serif}
.q{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.q.done{opacity:.55}.q.cur{color:#ffe08a}
.info{font-size:14px;line-height:1.45;color:#e8ecdf}
.info code{background:#0006;padding:1px 5px;border-radius:5px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.cols2{grid-template-columns:1fr}}
#dead{position:fixed;inset:0;background:rgba(80,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:35;pointer-events:auto}
#dead h1{font-size:44px;margin:0 0 10px;text-shadow:0 4px 20px #000}

/* ===== Kompaktes HUD (v3) ===== */
body #statsBox{width:148px;padding:5px 7px 6px;border-radius:10px;background:rgba(10,18,12,.42)}
body .st{gap:5px;margin:2px 0;font-size:10px}
body .st b{width:13px;font-size:10.5px}
body .st .tr{height:5px;border-radius:3px}
body .st .tr i{border-radius:3px}
body #lvlRow{margin-top:4px;gap:5px}
body #lvlBadge{font-size:10px;padding:0 5px;border-radius:6px}
body #xpTr{height:4px}
body #questBox{margin-top:5px;padding-top:4px;font-size:10.5px;line-height:1.2}
body #questBox .qd{display:none}
body #topC{font-size:12px;padding:2px 10px;gap:7px;background:rgba(10,18,12,.42)}
body #topC #biomeL{font-size:10.5px}
body #mini{width:88px;height:88px;border-width:2px}
body .hb{width:34px;height:34px;font-size:16px;border-radius:10px;background:rgba(10,18,12,.42)}
body .tbtns{gap:4px}
body #topR{gap:5px}
body #hotbar{gap:4px}
body #hotbar .slot{width:44px;height:44px;font-size:22px;border-radius:9px;background:rgba(14,22,16,.5)}
body.touch #hotbar .slot{width:38px;height:38px;font-size:19px}
body #prompt{font-size:12.5px;padding:4px 11px;background:rgba(10,18,12,.6)}
body #toasts{top:128px}
body .toast{font-size:11.5px;padding:3px 8px;border-left-width:3px}
body #banner{font-size:clamp(17px,2.6vw,26px)}
body #tut{width:min(360px,44%);font-size:11px;padding:5px 9px;border-radius:10px;background:rgba(255,224,138,.88)}
body #tut b{font-size:11.5px}

/* ---------- Biome & Terrain ---------- */
const B={OCEAN:0,BEACH:1,FOREST:2,MOUNTAIN:3,DESERT:4,SNOW:5,JUNGLE:6};
const BNAME=[['Meer','Ocean'],['Strand','Beach'],['Grüner Wald','Green Forest'],['Berge','Mountains'],['Wüste','Desert'],['Schneeberge','Snow Mountains'],['Dschungel','Jungle']];
const SIZE=800,HALF=400,SEG=200,GN=SEG+1,STEP=SIZE/SEG;
let H=null,BIO=null,LAKES=[],mapBase=null,terrainMesh=null;
const ISLES=[{x:330,z:110,r:28},{x:-322,z:-40,r:24},{x:110,z:338,r:22}];
let RIVPH=0;
function riverX(z){return -96+30*Math.sin(z*.018+RIVPH)+14*Math.sin(z*.041);}
function tinfo(x,z){
 const d=Math.hypot(x,z),a=Math.atan2(z,x);
 const R=262+40*(fbm(Math.cos(a)*1.6+11,Math.sin(a)*1.6+11,3)-.5)*2;
 const m=smooth(R+12,R-40,d);
 const hills=fbm(x*.011+3,z*.011+7,4);
 let h=-9+m*12+(hills-.42)*15*smooth(R-10,R-90,d);
 const mf=smooth(-60,-150,z)*smooth(R+20,R-60,d);
 if(mf>0){const rg=1-Math.abs(fbm(x*.018+50,z*.018+50,4)*2-1);h+=mf*(rg*rg*52+fbm(x*.06,z*.06,2)*6);}
 const df=smooth(60,130,x)*(1-smooth(100,160,Math.abs(z)))*m;
 if(df>0){const du=(Math.sin(x*.08+z*.03+fbm(x*.02,z*.02,2)*6)*.5+.5)*2.5+fbm(x*.03+9,z*.03,3)*4;h=lerp(h,-9+m*12.5+du,df);}
 const jf=smooth(0,60,x)*smooth(30,100,z)*(1-df);
 if(jf>0)h+=jf*(fbm(x*.045+20,z*.045,3)-.4)*7*smooth(R-10,R-70,d);
 if(z>-95&&z<R+40){const rx=riverX(z),dr=Math.abs(x-rx),w=4+(z+95)*.012,st=smooth(-95,-75,z);const tv=smooth(w+22,w+4,dr)*st;if(tv>0)h=lerp(h,Math.min(h,1.4+(h-1.4)*.3),tv*.7);const t=smooth(w+3,w,dr)*st;if(t>0)h=lerp(h,-2.2,t);}
 for(const L of LAKES){const dl=Math.hypot(x-L.x,z-L.z);if(dl<L.r*2.3){const b=smooth(L.r*2.3,L.r*1.1,dl);h=lerp(h,L.rim+(h-L.rim)*.25,b);h=lerp(h,-L.depth,smooth(L.r,L.r*.5,dl));}}
 for(const s of ISLES){const di=Math.hypot(x-s.x,z-s.z);if(di<s.r*1.6)h=Math.max(h,-9+12.5*smooth(s.r*1.5,s.r*.3,di)+fbm(x*.05,z*.05,2)*3*smooth(s.r,0,di));}
 return{h,mf,df,jf};
}
function biomeOf(i,x,z){const h=i.h;if(h<-.3)return B.OCEAN;if(z<-178+fbm(x*.02,z*.02+5,2)*40||h>40)return B.SNOW;if(h<2.2)return B.BEACH;if(i.mf>.3&&h>9)return B.MOUNTAIN;if(i.df>.45)return B.DESERT;if(i.jf>.45)return B.JUNGLE;return B.FOREST;}
function terrainH(x,z){const gx=(x+HALF)/STEP,gz=(z+HALF)/STEP;const ix=Math.floor(gx),iz=Math.floor(gz);if(ix<0||iz<0||ix>=SEG||iz>=SEG)return -10;const fx=gx-ix,fz=gz-iz;const a=H[iz*GN+ix],b=H[(iz+1)*GN+ix],c=H[(iz+1)*GN+ix+1],d=H[iz*GN+ix+1];if(fx+fz<=1)return a+(d-a)*fx+(b-a)*fz;return c+(b-c)*(1-fx)+(d-c)*(1-fz);}
function biomeAt(x,z){const ix=clamp(Math.round((x+HALF)/STEP),0,SEG),iz=clamp(Math.round((z+HALF)/STEP),0,SEG);return BIO[iz*GN+ix];}
function iceAt(x,z){for(const L of LAKES)if(L.ice&&Math.hypot(x-L.x,z-L.z)<L.r*1.05)return true;return false;}
function groundAt(x,z){const h=terrainH(x,z);if(h<.06&&iceAt(x,z))return .06;return h;}
function isFresh(x,z){for(const L of LAKES)if(Math.hypot(x-L.x,z-L.z)<L.r+4)return true;if(z>-95&&Math.abs(x-riverX(z))<12&&Math.hypot(x,z)<250)return true;return false;}

const BCOL=[[.76,.70,.50],[.87,.79,.58],[.36,.66,.28],[.45,.55,.33],[.90,.76,.48],[.95,.97,1],[.20,.55,.22]];
function buildTerrain(){
 const geo=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);geo.rotateX(-Math.PI/2);
 const pos=geo.attributes.position;H=new Float32Array(GN*GN);BIO=new Uint8Array(GN*GN);
 for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);const inf=tinfo(x,z);H[i]=inf.h;BIO[i]=biomeOf(inf,x,z);pos.setY(i,inf.h);}
 const col=new Float32Array(pos.count*3);const mc=document.createElement('canvas');mc.width=GN;mc.height=GN;const mx=mc.getContext('2d');const id=mx.createImageData(GN,GN);
 for(let iz=0;iz<GN;iz++)for(let ix=0;ix<GN;ix++){const i=iz*GN+ix,h=H[i],b=BIO[i];const x=ix*STEP-HALF,z=iz*STEP-HALF;
  const hl=H[iz*GN+Math.max(ix-1,0)],hr=H[iz*GN+Math.min(ix+1,SEG)],hu=H[Math.max(iz-1,0)*GN+ix],hd=H[Math.min(iz+1,SEG)*GN+ix];
  const slope=(Math.abs(hr-hl)+Math.abs(hd-hu))/(2*STEP);const n=fbm(x*.08,z*.08,2)-.5;
  let c=BCOL[b].slice();
  if(b===B.OCEAN){const dp=clamp(-h/9,0,1);c=[lerp(.82,.25,dp),lerp(.76,.45,dp),lerp(.55,.5,dp)];}
  if(b===B.FOREST||b===B.JUNGLE){c[0]+=n*.12;c[1]+=n*.16;}
  if(b===B.MOUNTAIN){const r=smooth(.5,1.1,slope);c=[lerp(.42,.53,r),lerp(.56,.52,r),lerp(.32,.5,r)];}
  if(b===B.SNOW){const r=smooth(.7,1.3,slope);c=[lerp(.95,.62,r),lerp(.97,.65,r),lerp(1,.7,r)];}
  if(b===B.DESERT){c[0]+=n*.08;c[1]+=n*.06;}
  if(b===B.BEACH||b===B.OCEAN){const wet=smooth(.9,.05,h)*smooth(-.6,-.05,h);c=[lerp(c[0],c[0]*.72,wet),lerp(c[1],c[1]*.72,wet),lerp(c[2],c[2]*.75,wet)];const foam=smooth(-.55,-.12,h)*smooth(.25,-.05,h);c=[lerp(c[0],.97,foam*.85),lerp(c[1],.99,foam*.85),lerp(c[2],1,foam*.85)];}
  if(slope>1.0&&b!==B.SNOW&&b!==B.OCEAN){const r=smooth(1,1.6,slope);c=[lerp(c[0],.5,r),lerp(c[1],.48,r),lerp(c[2],.44,r)];}
  col[i*3]=c[0];col[i*3+1]=c[1];col[i*3+2]=c[2];
  // Kartenbild
  let mc3=c;if(h<0){const dp=clamp(-h/8,0,1);mc3=[lerp(.35,.1,dp),lerp(.72,.35,dp),lerp(.85,.65,dp)];}
  const shade=clamp(1+(hl-hr)*.06+(hu-hd)*.04,.7,1.25);const k=i*4;id.data[k]=clamp(mc3[0]*shade,0,1)*255;id.data[k+1]=clamp(mc3[1]*shade,0,1)*255;id.data[k+2]=clamp(mc3[2]*shade,0,1)*255;id.data[k+3]=255;}
 mx.putImageData(id,0,0);mapBase=mc;
 for(const L of LAKES)if(L.ice){/* Eis wird separat gezeichnet */}
 geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();
 terrainMesh=new THREE.Mesh(geo,lam(0xffffff,{vertexColors:true,map:TEX.ground}));terrainMesh.receiveShadow=true;worldGroup.add(terrainMesh);
 for(const L of LAKES)if(L.ice){const m=mesh(new THREE.CircleGeometry(L.r*1.08,28),M.iceSheet,worldGroup,L.x,.06,L.z);m.rotation.x=-Math.PI/2;m.castShadow=false;}
}

function emit(sys,x,y,z,hex,n,sp,grav,life,spy){tmpC.setHex(hex);for(let k=0;k<n;k++){const i=sys.i=(sys.i+1)%sys.n;sys.pos[i*3]=x+(Math.random()-.5)*.2;sys.pos[i*3+1]=y;sys.pos[i*3+2]=z+(Math.random()-.5)*.2;const s=sp;sys.vel[i*3]=(Math.random()-.5)*s;sys.vel[i*3+1]=spy!=null?spy*(.6+Math.random()*.8):Math.random()*s;sys.vel[i*3+2]=(Math.random()-.5)*s;const L=(life||.8)*(.7+Math.random()*.6);sys.life[i]=L;sys.max[i]=L;sys.grav[i]=grav;const v=.8+Math.random()*.35;sys.base[i*3]=tmpC.r*v;sys.base[i*3+1]=tmpC.g*v;sys.base[i*3+2]=tmpC.b*v;sys.col[i*3]=sys.base[i*3];sys.col[i*3+1]=sys.base[i*3+1];sys.col[i*3+2]=sys.base[i*3+2];}}

const STEPUP=.75;
function supportY(x,z,feet){let g=groundAt(x,z);for(const c of COLS){if(!c.on)continue;const dx=x-c.x,dz=z-c.z;if(Math.abs(dx)>c.rad+.4||Math.abs(dz)>c.rad+.4)continue;const lx=c.cos*dx-c.sin*dz,lz=c.sin*dx+c.cos*dz;if(Math.abs(lx)<=c.hw+.05&&Math.abs(lz)<=c.hd+.05){let top=c.top;if(c.ramp)top=c.bot+clamp((lz+c.hd)/(2*c.hd),0,1)*c.rampH;if(feet>=top-STEPUP&&top>g)g=top;}}return g;}
function pushOut(p,r,feet,head){for(const c of COLS){if(!c.on||c.ramp)continue;if(feet>=c.top-STEPUP||head<=c.bot)continue;const dx=p.x-c.x,dz=p.z-c.z;if(Math.abs(dx)>c.rad+r||Math.abs(dz)>c.rad+r)continue;const lx=c.cos*dx-c.sin*dz,lz=c.sin*dx+c.cos*dz;const qx=clamp(lx,-c.hw,c.hw),qz=clamp(lz,-c.hd,c.hd);const ex=lx-qx,ez=lz-qz;const d2=ex*ex+ez*ez;if(d2>=r*r)continue;let nx,nz;if(d2>1e-6){const d=Math.sqrt(d2);nx=lx+ex/d*(r-d);nz=lz+ez/d*(r-d);}else{const px=c.hw-Math.abs(lx),pz=c.hd-Math.abs(lz);if(px<pz){nx=Math.sign(lx||1)*(c.hw+r);nz=lz;}else{nz=Math.sign(lz||1)*(c.hd+r);nx=lx;}}p.x=c.x+c.cos*nx+c.sin*nz;p.z=c.z-c.sin*nx+c.cos*nz;}
 for(const o of resNear(p.x,p.z,3)){const rr=o.def.r*(o.s||1)*.9;if(rr<=0)continue;if(feet>o.y+2.5)continue;const dx=p.x-o.x,dz=p.z-o.z;const d=Math.hypot(dx,dz);if(d<rr+r&&d>1e-4){p.x=o.x+dx/d*(rr+r);p.z=o.z+dz/d*(rr+r);}}}

 let dx=fx*mz+rx*mx,dz=fz*mz+rz*mx;const moving=Math.hypot(dx,dz)>.05;

 let sprint=wantSprint&&!P.exh&&P.sta>0&&!P.swim;
 let spd=P.swim?3.2:sprint?8.6:5;if(P.en<15)spd*=.75;if(P.hu<10||P.th<10)spd*=.85;if(Build.active)spd*=.9;

 P.sprint=sprint;
 const tvx=dx*spd,tvz=dz*spd;const acc=P.onGround||P.swim?12:3;P.vx=lerp(P.vx,tvx,clamp(acc*dt,0,1));P.vz=lerp(P.vz,tvz,clamp(acc*dt,0,1));
 if(moving&&P.swing<=0)P.face=lerpAngle(P.face,Math.atan2(dx,dz),clamp(dt*12,0,1));
 const np={x:P.pos.x+P.vx*dt,z:P.pos.z+P.vz*dt};
 pushOut(np,.42,P.pos.y,P.pos.y+1.9);np.x=clamp(np.x,-390,390);np.z=clamp(np.z,-390,390);
 const th=terrainH(np.x,np.z);
 // Schwimmen

 const it=curItem();

function findHitTarget(resOnly){let best=null,bd=1e9;const px=P.pos.x,pz=P.pos.z;
 if(!resOnly)for(const a of ANIMALS){if(a.dead)continue;const d=Math.hypot(a.x-px,a.z-pz);if(d<3.2&&d<bd){bd=d;best={x:a.x,z:a.z,animal:a};}}
 if(best)return best;
 const fx=Math.sin(P.face),fz=Math.cos(P.face);
 for(const o of resNear(px,pz,4.5)){if(Math.abs(o.y-P.pos.y)>3)continue;const dx=o.x-px,dz=o.z-pz;const d=Math.hypot(dx,dz)-o.def.r*(o.s||1);if(d>2.3)continue;const dot=(dx*fx+dz*fz)/(Math.hypot(dx,dz)+1e-4);const sc=d-dot*.8;if(sc<bd){bd=sc;best={x:o.x,z:o.z,res:o,def:o.def};}}
 return best;}
function doHit(){const t=findHitTarget();const it=curItem();const tool=it&&it.tool;
 if(!t){return;}
 if(t.animal){const dmg=tool&&tool.dmg?tool.dmg:4;hurtAnimal(t.animal,dmg);wearTool(1);return;}
 const r=t.res,def=r.def;let dmg=1;
 if(def.tool==='any')dmg=(tool&&tool.type==='knife')?2:1;
 else{const match=tool&&tool.type===def.tool;if(def.tier&&(!match||(tool.tier||0)<def.tier)){toast(def.tier>=2?T('Du brauchst eine Metall-Spitzhacke','You need a metal pickaxe'):T('Du brauchst eine Spitzhacke','You need a pickaxe'),'#ff8f7a');sfx('err');return;}dmg=match?tool.power:1;}
 if(def.prick&&!(tool&&tool.type==='axe')){hurtPlayer(def.prick,T('Autsch! Stachelig.','Ouch! Prickly.'));}
 r.hp-=dmg;r.shake=.25;G.shake=Math.max(G.shake||0,.06);burst(r.x,r.y+(FELL[r.kind]?1.2:.6),r.z,FELL[r.kind]?0xa8794a:def.col,8,4);sfx(def.snd);if(tool&&def.tool!=='any')wearTool(1);
 if(r.hp<=0)harvestRes(r);}

function fellTree(r,remote){const k=KIND[r.kind];const away=Math.atan2(r.x-P.pos.x,r.z-P.pos.z);const outer=new THREE.Group();outer.position.set(r.x,r.y,r.z);outer.rotation.y=away;const inner=new THREE.Group();outer.add(inner);const tr=new THREE.Group();tr.rotation.set(r.tilt||0,r.rot-away,0);tr.scale.set(r.s,r.sy||r.s,r.s);inner.add(tr);

function floorTopAt(x,z,ignore){let best=null;for(const b of BUILDINGS){const d=BUILD[b.id];if(!d.floor)continue;const c=Math.cos(b.rot),s=Math.sin(b.rot);const dx=x-b.x,dz=z-b.z;const lx=c*dx-s*dz,lz=s*dx+c*dz;if(Math.abs(lx)<=d.w/2+.01&&Math.abs(lz)<=d.d/2+.01){const t=b.y+d.floor;if(best==null||t>best)best=t;}}return best;}
function updateBuild(){if(!Build.active)return;const def=BUILD[Build.id];const dist=Math.max(def.w,def.d)/2+2.3;const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw);let x=P.pos.x+fx*dist,z=P.pos.z+fz*dist;const gs=def.mod?2:.5;x=Math.round(x/gs)*gs;z=Math.round(z/gs)*gs;
 const rot=Build.rot,c=Math.cos(rot),s=Math.sin(rot),hw=def.w/2,hd=def.d/2;const hs=[terrainH(x,z)];for(const [a,b] of[[-hw,-hd],[hw,-hd],[-hw,hd],[hw,hd]])hs.push(terrainH(x+c*a+s*b,z-s*a+c*b));
 const mn=Math.min(...hs),mx=Math.max(...hs);let y=hs.reduce((a,b)=>a+b)/hs.length;const fl=floorTopAt(x,z);if(fl!=null&&fl>y-.6)y=fl;if(def.yOff)y+=def.yOff;
 let why='';const R=Math.max(def.w,def.d)/2;
 if(mn<.12&&fl==null)why=T('Nicht im Wasser','Not in water');else if(mx-mn>(def.mod?3:1.7)&&fl==null)why=T('Zu steil','Too steep');else if(!canAfford(def.cost))why=T('Zu wenig Material','Not enough materials');
 else{for(const b of BUILDINGS){const bd=BUILD[b.id];if(def.mod&&bd.mod)continue;if((def.cat==='deco'&&bd.mod)||(bd.cat==='deco'&&def.mod))continue;const br=Math.max(bd.w,bd.d)/2;if(Math.hypot(b.x-x,b.z-z)<(R+br)*.9){why=T('Überlappt ein Gebäude','Overlaps a building');break;}}
  if(!why)for(const p of POIS)if(Math.hypot(p.x-x,p.z-z)<p.r*.8+R*.6){why=T('Zu nah an einem Ort','Too close to a landmark');break;}
  if(!why)for(const o of resNear(x,z,R+2))if(o.def.r>0&&Math.hypot(o.x-x,o.z-z)<R*.8+o.def.r){why=T('Etwas steht im Weg','Something is in the way');break;}}
 Build.x=x;Build.y=y;Build.z=z;Build.ok=!why;Build.why=why;Build.ghost.position.set(x,y,z);Build.ghost.rotation.y=rot;
 if(Build.lastOk!==Build.ok){const m=Build.ok?ghostOK:ghostNO;Build.ghost.traverse(o=>{if(o.isMesh)o.material=m;});Build.lastOk=Build.ok;$('#bbPlace').className='bb '+(Build.ok?'ok':'no');}}

function createBuilding(id,x,y,z,rot,data){const def=BUILD[id];const g=def.make();g.position.set(x,y,z);g.rotation.y=rot;g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});buildGroup.add(g);
 const b={id,x,y,z,rot,g,cols:[],open:false,uid:(data&&(data.uid||data.u))||('b'+Math.random().toString(36).slice(2,10))};

 toast(T('Wächst… ','Growing… ')+Math.floor(pl.prog*100)+'%');}
function updatePlotMesh(b,pl){if(pl.mesh){b.g.remove(pl.mesh);pl.mesh=null;}if(pl.soil)pl.soil.material=pl.water>0?M.soilWet:M.soil;if(!pl.crop)return;const g=new THREE.Group();g.position.set(pl.lx,.25,pl.lz);const stg=Math.min(3,Math.floor(pl.prog*3)+1);const c=CROPS[pl.crop];
 for(const p of[[-.45,-.45],[.45,-.45],[-.45,.45],[.45,.45]]){const s=.25+stg*.18;const m=mesh(new THREE.ConeGeometry(.12*s+.05,.7*s,5),M.green,g,p[0],.35*s,p[1]);if(pl.prog>=1)mesh(new THREE.SphereGeometry(.14,6,5),matC(c.col),g,p[0],.7*s+.05,p[1]);}

function updPlots(dt){for(const b of BUILDINGS)if(b.plots)for(const pl of b.plots){if(!pl.crop||pl.prog>=1)continue;const wet=pl.water>0||W.rainNow>.3;if(W.rainNow>.3&&pl.water<200){pl.water=480;if(pl.soil)pl.soil.material=M.soilWet;}if(wet){pl.prog=Math.min(1,pl.prog+dt/CROPS[pl.crop].grow);pl.water-=dt;if(pl.water<=0&&pl.soil)pl.soil.material=M.soil;}const stg=Math.min(3,Math.floor(pl.prog*3)+1);if(stg!==pl.stage||(pl.prog>=1)!==pl.ready)updatePlotMesh(b,pl);}}

function updAnimals(dt){const px=P.pos.x,pz=P.pos.z,night=isNight();let danger=0;
 for(const a of ANIMALS){if(a.dead){a.deadT-=dt;if(a.deadT<=0&&a.g.visible){a.g.visible=false;}a.respawn-=dt;if(a.respawn<=0){respawnAnimal(a);}continue;}
  const dx=px-a.x,dz=pz-a.z,d=Math.hypot(dx,dz);a.g.visible=d<S.view*.8;if(d>170)continue;const def=a.def;a.hurt-=dt;a.atk-=dt;a.body.position.y=lerp(a.body.position.y,0,dt*8);

  a.y=groundAt(a.x,a.z);a.g.position.set(a.x,a.y,a.z);a.g.rotation.y=a.dir;a.phase+=dt*a.spd*2.6;const s=Math.sin(a.phase)*.6*clamp(a.spd/3,0,1);a.legs[0].rotation.x=s;a.legs[3].rotation.x=s;a.legs[1].rotation.x=-s;a.legs[2].rotation.x=-s;}
 for(const b of BIRDS){b.a+=b.spd*dt/b.r;const x=b.cx+Math.cos(b.a)*b.r,z=b.cz+Math.sin(b.a)*b.r;const y=Math.max(terrainH(x,z),0)+b.h;b.g.position.set(x,y,z);b.g.rotation.y=-b.a;const f=Math.sin(G.playT*10+b.ph)*.6;b.wl.rotation.z=f;b.wr.rotation.z=-f;}
 if(PET){const tx=P.pos.x-Math.sin(P.face)*2.2+1,tz=P.pos.z-Math.cos(P.face)*2.2;const d=Math.hypot(tx-PET.x,tz-PET.z);let sp=0;if(d>30){PET.x=tx;PET.z=tz;}else if(d>1){sp=Math.min(d*2,9);const dir=Math.atan2(tx-PET.x,tz-PET.z);PET.dir=lerpAngle(PET.dir,dir,clamp(dt*6,0,1));PET.x+=Math.sin(PET.dir)*sp*dt;PET.z+=Math.cos(PET.dir)*sp*dt;}const y=Math.max(groundAt(PET.x,PET.z),-.6);PET.g.position.set(PET.x,y,PET.z);PET.g.rotation.y=PET.dir;PET.phase+=dt*sp*2.5;const s=Math.sin(PET.phase)*.6*clamp(sp/3,0,1);PET.legs[0].rotation.x=s;PET.legs[3].rotation.x=s;PET.legs[1].rotation.x=-s;PET.legs[2].rotation.x=-s;}

function updSurvival(dt){const b=biomeAt(P.pos.x,P.pos.z),night=isNight();let hu=.055,th=.08,en=.03;if(P.sprint){hu*=1.8;th*=1.6;}if(b===B.DESERT&&!night)th*=2;if(b===B.SNOW)hu*=1.4;if(P.amulet){hu*=.7;th*=.7;}if(P.swim)en*=1.5;

 let dmg=0;if(P.hu<=0)dmg+=.5;if(P.th<=0)dmg+=.8;if(P.en<=0)dmg+=.15;
 const cold=b===B.SNOW&&!P.coat&&!nearFire(8);if(cold){dmg+=.22;G.coldMsg-=dt;if(G.coldMsg<=0){G.coldMsg=14;toast('🥶 '+T('Dir ist kalt! Feuer, Fackel oder Fellmantel helfen.','You are freezing! Fire, torch or fur coat helps.'),'#8fe0ff');}}
 if(dmg>0){P.hp-=dmg*dt;if(P.hp<=0)die(P.th<=0?T('Verdurstet','Died of thirst'):P.hu<=0?T('Verhungert','Starved'):cold?T('Erfroren','Froze'):T('Erschöpft','Exhausted'));}
 else if(P.hu>50&&P.th>50)P.hp=Math.min(100,P.hp+(nearFire(6)?.6:.25)*dt);

const FOGN=64,FOGC=SIZE/FOGN;let FOG=new Uint8Array(FOGN*FOGN);

 const b=biomeAt(P.pos.x,P.pos.z);if(b!==B.OCEAN&&!G.biomes[b]){G.biomes[b]=1;if(G.playT>3){banner('🧭 '+T('Neues Gebiet: ','New area: ')+N(BNAME[b]),T('Entdeckungsbonus +25 XP','Discovery bonus +25 XP'));addXP(25);}}}

 const px=(cx-span/2+HALF)/SIZE*GN,pz=(cz-span/2+HALF)/SIZE*GN,ps=span/SIZE*GN;x.imageSmoothingEnabled=true;x.fillStyle='#163a52';x.fillRect(0,0,W2,H2);x.drawImage(mapBase,px,pz,ps,ps,0,0,W2,H2);

 const toS=(wx,wz)=>[(wx-(cx-span/2))*k,(wz-(cz-span/2))*k];x.textAlign='center';x.textBaseline='middle';x.font=(mini?12:Math.max(14,W2/34))+'px serif';

function initAudio(){if(AUD.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();AUD.ctx=ctx;AUD.master=ctx.createGain();AUD.master.connect(ctx.destination);AUD.sfx=ctx.createGain();AUD.sfx.connect(AUD.master);AUD.mus=ctx.createGain();AUD.mus.connect(AUD.master);AUD.amb=ctx.createGain();AUD.amb.connect(AUD.sfx);
 const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const ch=nb.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;AUD.noise=nb;
 const loop=(type,f,q)=>{const s=ctx.createBufferSource();s.buffer=nb;s.loop=true;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q||.7;const g=ctx.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(AUD.amb);s.start();return{g,fl};};
 AUD.wind=loop('bandpass',420,.6);AUD.rain=loop('highpass',1400);AUD.wave=loop('lowpass',380);AUD.fire=loop('bandpass',2400,2);
 const dl=ctx.createDelay();dl.delayTime.value=.42;const fb=ctx.createGain();fb.gain.value=.32;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;AUD.musIn=ctx.createGain();AUD.musIn.connect(AUD.mus);AUD.musIn.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(AUD.mus);

function applyVolumes(){if(!AUD.ctx)return;AUD.sfx.gain.value=S.sfx;AUD.mus.gain.value=S.music*.5;}
function tone(f,dur,type,vol,f2,delay,dest){const c=AUD.ctx;if(!c)return;const t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(dest||AUD.sfx);o.start(t);o.stop(t+dur+.05);}

 case'jump':nz(.08,800,'lowpass',.15);break;case'swim':nz(.25,900,'lowpass',.18);break;case'cast':nz(.2,2000,'bandpass',.15,0,2);tone(600,.15,'sine',.05,300,.2);break;

 case'level':[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.16,null,i*.09));break;case'quest':[659,784,988].forEach((f,i)=>tone(f,.22,'sine',.15,null,i*.1));break;

 case'step':{const b=a;nz(.06,b===B.BEACH||b===B.DESERT?1200:b===B.SNOW?2600:700,'lowpass',.09);break;}
 case'bird':{const f=2400+Math.random()*1200;for(let i=0;i<3;i++)tone(f,.07,'sine',.04,f*1.3,i*.11);break;}case'cricket':for(let i=0;i<4;i++)tone(4400,.03,'square',.012,null,i*.06);break;

const SCALES={day:[0,2,4,7,9],night:[0,3,5,7,10],danger:[0,1,3,6,7]};
let ambT=0;
function updAudio(dt,danger){const c=AUD.ctx;if(!c)return;const night=isNight();const b=biomeAt(P.pos.x,P.pos.z);const alt=clamp(P.pos.y/40,0,1);
 const k=.08;AUD.wind.g.gain.value=lerp(AUD.wind.g.gain.value,.05+alt*.12+W.cloud*.05+(b===B.SNOW?.06:0),k);AUD.rain.g.gain.value=lerp(AUD.rain.g.gain.value,W.rainNow>.05&&!W.snow?W.rainNow*.22:0,k);

 ambT-=dt;if(ambT<=0){ambT=1+Math.random()*3;if(!night&&(b===B.FOREST||b===B.JUNGLE)&&W.rainNow<.2)sfx('bird');else if(night&&b!==B.SNOW)sfx('cricket');if(nearFire(6))sfx('crack');}

/* =========================================================
   MULTIPLAYER – Echtzeit über den claude.ai-Raum (room-Fähigkeit)
   Lobby  = alle, die das Spiel geöffnet haben → Server-Liste über presence.srv
   Server = benannter Raum (join(code)); jeder Spieler teilt per presence:
            Position/Animation/Aussehen + Ereignis-Ringpuffer (Bäume, Gebäude, Truhen, Türen, Chat, Geben)
   Host   = teilt zusätzlich Welt-Seed, Uhrzeit, Wetter und einen Gebäude-Schnappschuss für Nachzügler
   ========================================================= */
const NET={tried:false,lobby:null,user:null,srv:null,code:null,host:false,online:false,seq:0,evs:[],seen:new Map(),av:new Map(),applying:false,sendT:0,snapI:0,hostSeen:0,hostPeer:null,names:new Map(),myId:null,staticChests:0,lastPeers:0,hostLostMsg:false};
function netAvail(){return !!(window.WS_SERVER||(window.claude&&typeof claude.use==='function'));}
async function netInit(){if(NET.tried)return !!NET.lobby;NET.tried=true;if(!netAvail())return false;if(window.WS_SERVER){NET.dedicated=true;NET.lobby=wsLobby();try{await NET.lobby._ready;}catch(e){}NET.lobby.onPeers(()=>{if(UIP.cur==='mp')renderServerList();},()=>{});return true;}try{const [room,user]=await Promise.all([claude.use('room'),claude.use('user').catch(()=>null)]);NET.lobby=room||null;NET.user=user||null;if(NET.user){try{NET.myId=await NET.user.id();}catch(e){}}
 if(NET.lobby){NET.lobby.onPeers(()=>{if(UIP.cur==='mp')renderServerList();},()=>{});}return !!NET.lobby;}catch(e){NET.lobby=null;return false;}}
function myNick(){return (S.char.name||'').trim().slice(0,16)||T('Spieler','Player');}
function charLite(){const c=S.char;return{sk:c.skin,sh:c.shirt,pa:c.pants,h:c.hat,o:c.outfit,cp:P.coat?1:0};}
function serverCode(){const w=['insel','palme','welle','fels','wald','lava','kokos','hai','muschel','sturm'];return w[Math.floor(Math.random()*w.length)]+'-'+(1000+Math.floor(Math.random()*9000));}
function netEv(type,...a){if(!NET.online||NET.applying)return;NET.seq++;NET.evs.push([NET.seq,type,...a]);if(NET.evs.length>24)NET.evs.shift();}
async function netHost(code,fresh){if(!(await netInit())){toast(T('Online nicht verfügbar','Online unavailable'),'#ff8f7a');return;}
 if(NET.dedicated){code=code||serverCode();S.lastServer=code;saveSettings();await netJoin(code,fresh?{create:1,n:myNick()}:null);return;}
 code=code||serverCode();showLoading(true);setLoad(.05,T('Server wird gestartet…','Starting server…'));
 try{NET.srv=await NET.lobby.join(code);}catch(e){showLoading(false);toast(T('Server konnte nicht gestartet werden: ','Could not start server: ')+(e&&e.code||e),'#ff8f7a');return;}
 NET.code=code;NET.host=true;S.lastServer=code;saveSettings();const slot='mp_'+code;await startGame(slot,fresh||!hasSave(slot));netStart();
 banner('🖥️ '+T('Server läuft: ','Server running: ')+code,T('Freunde können über MULTIPLAYER → Server beitreten mitspielen.','Friends can join via MULTIPLAYER → Join server.'));}
async function netJoin(code,createOpt){code=(code||'').trim().toLowerCase();if(!/^[a-z0-9][a-z0-9_.-]{0,47}$/.test(code)){toast(T('Ungültiger Server-Code','Invalid server code'),'#ff8f7a');return;}
 if(!(await netInit())){toast(T('Online nicht verfügbar','Online unavailable'),'#ff8f7a');return;}
 showLoading(true);setLoad(.05,T('Verbinde mit ','Connecting to ')+code+'…');
 try{NET.srv=await NET.lobby.join(code,createOpt);}catch(e){showLoading(false);toast(T('Beitreten fehlgeschlagen: ','Join failed: ')+(e&&(e.message||e.code)||e),'#ff8f7a');renderMenu();return;}
 let host=null;const t0=performance.now();while(performance.now()-t0<12000){host=NET.srv.peers().find(p=>!p.sameTab&&p.presence&&p.presence.host&&typeof p.presence.seed==='number');if(host)break;setLoad(.05+(performance.now()-t0)/12000*.3,T('Suche Host von ','Looking for host of ')+code+'…');await new Promise(r=>setTimeout(r,250));}
 if(!host){try{await NET.srv.leave();}catch(e){}NET.srv=null;showLoading(false);toast(NET.dedicated?T('Diese Welt gibt es auf dem Server nicht. Prüfe den Code oder erstelle eine neue.','This world does not exist on the server. Check the code or create a new one.'):T('Kein Host gefunden. Ist der Server noch offen?','No host found. Is the server still open?'),'#ff8f7a');renderMenu();return;}
 NET.code=code;NET.host=false;S.lastJoin=code;saveSettings();const slot='mp_'+code;const seed=host.presence.seed;
 let fresh=!hasSave(slot);if(!fresh){try{const d=JSON.parse(LS.get(slotKey(slot)));if(d.seed!==seed)fresh=true;}catch(e){fresh=true;}}
 await startGame(slot,fresh,seed);if(fresh){const hp=host.presence.p;if(hp){P.pos.set(hp[0]+2,supportY(hp[0]+2,hp[2],hp[1]+2),hp[2]+2);}}netStart();
 banner('🌐 '+T('Verbunden mit ','Connected to ')+code,T('Viel Spaß zusammen!','Have fun together!'));}
function netStart(){NET.online=true;NET.seq=0;NET.evs=[];NET.seen=new Map();NET.staticChests=CHESTS.filter(c=>!c.drift).length;NET.hostSeen=performance.now();NET.hostLostMsg=false;
 NET.srv.on&&0;$('#bChat').classList.remove('hidden');$('#netL').classList.remove('hidden');
 if(NET.host&&NET.lobby)NET.lobby.presence({srv:{c:NET.code,n:myNick(),s:SEED,p:1,d:G.day}}).catch(()=>{});
 NET.srv.onPeers(ch=>{for(const p of ch.joined)if(!p.sameTab&&G.state==='play')toast('👋 '+peerName(p)+T(' ist beigetreten',' joined'),'#8be8ff');for(const p of ch.left)if(!p.sameTab){toast('🚪 '+peerName(p)+T(' hat den Server verlassen',' left'),'#b9c4b2');removeAvatar(p.peer);}},()=>{});

async function netLeave(){if(!NET.online&&!NET.srv)return;NET.online=false;for(const k of[...NET.av.keys()])removeAvatar(k);try{if(NET.srv)await NET.srv.leave();}catch(e){}NET.srv=null;if(NET.host&&NET.lobby)NET.lobby.presence({srv:null}).catch(()=>{});NET.host=false;NET.code=null;$('#bChat').classList.add('hidden');$('#netL').classList.add('hidden');}
function peerName(p){const pr=p.presence||{};return String(pr.n||T('Spieler','Player')).slice(0,16);}

/* ---------- Senden ---------- */
function netSend(force){if(!NET.online||!NET.srv)return;const now=performance.now();if(!force&&now-NET.sendT<100)return;NET.sendT=now;
 const pr={v:1,n:myNick(),c:charLite(),p:[+P.pos.x.toFixed(2),+P.pos.y.toFixed(2),+P.pos.z.toFixed(2),+P.face.toFixed(2)],a:[+P.speed.toFixed(1),P.swim?1:0,P.onGround?1:0,P.sprint?1:0,+P.swing.toFixed(2),F.st!=='idle'?1:0],t:PM.toolId||null,hp:Math.round(P.hp),lv:P.lvl,ev:{l:NET.evs}};
 if(NET.host){pr.host=1;pr.seed=SEED;pr.tm=+G.time.toFixed(4);pr.dy=G.day;pr.w=W.state;
  const per=22,list=BUILDINGS.filter(b=>b.uid);const pages=Math.max(1,Math.ceil(list.length/per));NET.snapI=(NET.snapI+1)%pages;
  pr.sb={i:NET.snapI,n:pages,b:list.slice(NET.snapI*per,NET.snapI*per+per).map(b=>[b.uid,b.id,+b.x.toFixed(2),+b.y.toFixed(2),+b.z.toFixed(2),+b.rot.toFixed(3),b.open?1:0])};
  pr.sc=CHESTS.slice(0,NET.staticChests).map((c,i)=>c.opened?i:-1).filter(i=>i>=0).slice(0,120);
  if(secretDoor&&secretDoor.open)pr.sd=1;}
 NET.srv.presence(pr).catch(()=>{});
 if(NET.host&&NET.lobby&&Math.random()<.02){const n=NET.srv.peers().length;NET.lobby.presence({srv:{c:NET.code,n:myNick(),s:SEED,p:n,d:G.day}}).catch(()=>{});}}

/* ---------- Empfangen ---------- */
function netTick(dt){if(!NET.online||!NET.srv)return;netSend(false);const peers=NET.srv.peers();let others=0,hostHere=false;
 for(const p of peers){if(p.sameTab)continue;const pr=p.presence;if(!pr)continue;
  if(pr.host){hostHere=true;NET.hostSeen=performance.now();if(!NET.host){if(typeof pr.tm==='number'){let d=pr.tm-G.time;if(d>.5)d-=1;if(d<-.5)d+=1;if(Math.abs(d)>.01)G.time=(pr.tm+1)%1;}if(pr.dy&&pr.dy!==G.day)G.day=pr.dy;if(pr.w&&WS[pr.w]&&pr.w!==W.state)setWeather(pr.w);applySnapshot(pr);}}
  if(!Array.isArray(pr.p))continue;others++;updateAvatar(p,pr,dt);applyEvents(p,pr);}
 if(!NET.host&&!hostHere&&performance.now()-NET.hostSeen>6000&&!NET.hostLostMsg){NET.hostLostMsg=true;toast(T('Der Host ist offline. Du spielst lokal weiter, Änderungen werden nicht mehr geteilt.','The host is offline. You keep playing locally; changes are no longer shared.'),'#ffb648');}
 if(hostHere)NET.hostLostMsg=false;
 if(others!==NET.lastPeers){NET.lastPeers=others;}$('#netL').textContent='👥 '+(others+1)+' · '+NET.code;}
function applySnapshot(pr){if(pr.sb&&Array.isArray(pr.sb.b)){NET.applying=true;try{for(const e of pr.sb.b){if(!Array.isArray(e)||!BUILD[e[1]])continue;let b=BUILDINGS.find(x=>x.uid===e[0]);if(!b)b=createBuilding(e[1],e[2],e[3],e[4],e[5],{uid:e[0]});if(b&&!!e[6]!==b.open)setDoor(b,!!e[6]);}}finally{NET.applying=false;}}
 if(Array.isArray(pr.sc))for(const i of pr.sc){const c=CHESTS[i];if(c&&!c.opened&&i<NET.staticChests){c.opened=true;c.lid.rotation.x=-1.9;}}
 if(pr.sd&&secretDoor&&!secretDoor.open){secretDoor.open=true;secretDoor.g.visible=false;secretDoor.cols.forEach(c=>c.on=false);secretDoor.chest.locked=false;}}
function applyEvents(p,pr){const l=pr.ev&&pr.ev.l;if(!Array.isArray(l))return;let last=NET.seen.get(p.peer);if(last==null){last=l.length?l[l.length-1][0]:0;NET.seen.set(p.peer,last);for(const e of l)if(e[1]==='m'&&e[0]>last-3)0;return;}
 NET.applying=true;try{for(const e of l){if(!Array.isArray(e)||!(e[0]>last))continue;last=e[0];applyEv(p,pr,e);}}catch(err){}finally{NET.applying=false;}NET.seen.set(p.peer,last);}
function applyEv(p,pr,e){const t=e[1];
 if(t==='r'){const r=RESLIST[e[2]];if(!r||!r.alive||r.kind==='star')return;r.alive=false;r.respawn=100+Math.random()*120;if(FELL[r.kind]){resVisual(r,0);fellTree(r,true);}else{r.vanish=.35;burst(r.x,r.y+.6,r.z,r.def.col,10,5);}}
 else if(t==='b'){if(!BUILD[e[3]]||BUILDINGS.find(x=>x.uid===e[2]))return;createBuilding(e[3],e[4],e[5],e[6],e[7],{uid:e[2]});burst(e[4],e[5]+1,e[6],0xc9a26b,14,4);}
 else if(t==='c'){const c=CHESTS[e[2]];if(c&&!c.opened&&e[2]<NET.staticChests){c.opened=true;c.lid.rotation.x=-1.9;}}
 else if(t==='d'){const b=BUILDINGS.find(x=>x.uid===e[2]);if(b)setDoor(b,!!e[3]);}
 else if(t==='sd'){if(secretDoor&&!secretDoor.open){secretDoor.open=true;secretDoor.g.visible=false;secretDoor.cols.forEach(c=>c.on=false);secretDoor.chest.locked=false;}}
 else if(t==='m'){const txt=String(e[2]||'').slice(0,120);addChatLine(peerName(p),txt);const a=NET.av.get(p.peer);if(a)showBubble(a,txt);}
 else if(t==='g'){if(e[2]!==myPeer())return;const id=e[3],n=Math.max(1,Math.min(99,e[4]|0));if(!ITEMS[id])return;invAdd(id,n,true,true,e[5]);toast('🎁 '+peerName(p)+T(' hat dir ',' gave you ')+n+'× '+ITEMS[id].icon+' '+iname(id)+T(' gegeben',''),'#8be8ff');sfx('chest');}}
function myPeer(){if(!NET.srv)return null;const me=NET.srv.peers().find(p=>p.sameTab);return me?me.peer:null;}

/* ---------- Mitspieler-Avatare ---------- */
function nameTag(text){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='bold 30px Fredoka, sans-serif';const w=Math.min(250,x.measureText(text).width+28);x.fillStyle='rgba(10,18,12,.65)';const r=16,x0=(256-w)/2;x.beginPath();x.moveTo(x0+r,8);x.arcTo(x0+w,8,x0+w,56,r);x.arcTo(x0+w,56,x0,56,r);x.arcTo(x0,56,x0,8,r);x.arcTo(x0,8,x0+w,8,r);x.fill();x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(text,128,33);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));sp.scale.set(2.4,.6,1);sp.renderOrder=5;return sp;}
function avatarChar(pr){const c=pr.c||{};const ok=v=>typeof v==='string'&&/^#[0-9a-fA-F]{6}$/.test(v);return{skin:ok(c.sk)?c.sk:'#f1c27d',shirt:ok(c.sh)?c.sh:'#e9e2cf',pants:ok(c.pa)?c.pa:'#3b5b8c',hat:HATS[c.h]?c.h:'none',outfit:OUTFITS[c.o]?c.o:'castaway'};}
function updateAvatar(p,pr,dt){let a=NET.av.get(p.peer);const key=JSON.stringify(pr.c||{})+'|'+peerName(p);
 if(!a||a.key!==key){if(a)removeAvatar(p.peer);const m=charModel(avatarChar(pr),pr.c&&pr.c.cp,false);scene.add(m.root);const tag=nameTag(peerName(p)+(pr.lv?' · Lv '+pr.lv:''));tag.position.y=2.95;m.root.add(tag);
  a={m,key,tag,pos:new THREE.Vector3(pr.p[0],pr.p[1],pr.p[2]),face:pr.p[3]||0,toolId:undefined,bubble:null,bT:0};m.root.position.copy(a.pos);NET.av.set(p.peer,a);}
 const tp=pr.p;const target=new THREE.Vector3(+tp[0]||0,+tp[1]||0,+tp[2]||0);if(a.pos.distanceTo(target)>25)a.pos.copy(target);else a.pos.lerp(target,clamp(dt*10,0,1));a.face=lerpAngle(a.face,+tp[3]||0,clamp(dt*12,0,1));
 const an=Array.isArray(pr.a)?pr.a:[0,0,1,0,0,0];const tid=ITEMS[pr.t]&&ITEMS[pr.t].tool?pr.t:null;if(a.toolId!==tid){if(a.m.tool)a.m.hand.remove(a.m.tool);a.m.tool=tid?toolModel(tid):null;if(a.m.tool)a.m.hand.add(a.m.tool);a.toolId=tid;}
 animateModel(a.m,{pos:a.pos,face:a.face,speed:+an[0]||0,swim:!!an[1],onGround:!!an[2],sprint:!!an[3],swing:+an[4]||0,fish:!!an[5]},dt);
 a.m.root.visible=Math.abs(a.pos.x-P.pos.x)<S.view&&Math.abs(a.pos.z-P.pos.z)<S.view;
 if(a.bubble){a.bT-=dt;if(a.bT<=0){a.m.root.remove(a.bubble);a.bubble=null;}}}
function removeAvatar(peer){const a=NET.av.get(peer);if(!a)return;scene.remove(a.m.root);NET.av.delete(peer);NET.seen.delete(peer);}
function showBubble(a,txt){if(a.bubble)a.m.root.remove(a.bubble);const sp=nameTag('💬 '+txt.slice(0,22)+(txt.length>22?'…':''));sp.position.y=3.6;sp.scale.set(3.2,.8,1);a.m.root.add(sp);a.bubble=sp;a.bT=6;}
function nearbyPlayers(r){const out=[];if(!NET.online)return out;for(const [peer,a] of NET.av){if(a.pos.distanceTo(P.pos)<r)out.push({peer,a});}return out;}
function peerByKey(peer){return NET.srv?NET.srv.peers().find(p=>p.peer===peer):null;}

const CHAT=[];
function addChatLine(who,txt){CHAT.push({who,txt,t:Date.now()});if(CHAT.length>40)CHAT.shift();toast('💬 '+who+': '+txt,'#8be8ff');if(UIP.cur==='chat')renderChat();}
function openChat(){openPanel('chat','💬 Chat · '+(NET.code||''),'<div id="chatWrap"></div>');renderChat();}
function renderChat(){const w=$('#chatWrap');if(!w)return;const peers=NET.srv?NET.srv.peers():[];
 w.innerHTML=`<p style="color:#b9c4b2;margin-top:0">👥 ${peers.map(p=>(p.sameTab?'⭐ ':'')+esc(peerName(p.sameTab?{presence:{n:myNick()}}:p))).join(' · ')}</p><div id="chatLog" style="max-height:38vh;overflow:auto;background:#0004;border-radius:10px;padding:8px;font-size:14px">${CHAT.map(c=>`<div><b style="color:#8be8ff">${esc(c.who)}:</b> ${esc(c.txt)}</div>`).join('')||'<span style="color:#b9c4b2">'+T('Noch keine Nachrichten.','No messages yet.')+'</span>'}</div>
 <form id="chatF" style="display:flex;gap:8px;margin-top:8px"><input id="chatIn" maxlength="120" autocomplete="off" placeholder="${T('Nachricht…','Message…')}" style="flex:1;font-family:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid #ffffff33;background:#ffffff14;color:#fff"><button class="btn" type="submit">${T('Senden','Send')}</button></form>`;
 const lg=$('#chatLog');lg.scrollTop=lg.scrollHeight;$('#chatF').onsubmit=e=>{e.preventDefault();const v=$('#chatIn').value.trim();if(!v)return;netEv('m',v.slice(0,120));CHAT.push({who:myNick(),txt:v.slice(0,120),t:Date.now()});$('#chatIn').value='';netSend(true);renderChat();};}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function giveItem(slotI,peer){const s=Inv.slots[slotI];if(!s)return;const p=peerByKey(peer);if(!p){toast(T('Spieler nicht mehr da','Player is gone'),'#ff8f7a');return;}netEv('g',peer,s.id,s.n,s.d);netSend(true);toast('🎁 '+s.n+'× '+ITEMS[s.id].icon+' '+iname(s.id)+T(' an ',' to ')+peerName(p)+T(' gegeben',''),'#8be8ff');Inv.slots[slotI]=null;sfx('pickup');refreshInvUI();}

/* ---------- Multiplayer-Menü ---------- */
async function openMultiplayer(){openPanel('mp','🌐 Multiplayer','<div id="mpWrap"><p>'+T('Verbinde…','Connecting…')+'</p></div>');const ok=await netInit();if(UIP.cur!=='mp')return;renderServerList(ok);}
function renderServerList(okArg){const w=$('#mpWrap');if(!w)return;const ok=okArg!==undefined?okArg:!!NET.lobby;
 let list=[];if(ok){for(const p of NET.lobby.peers()){if(p.sameTab)continue;const s=p.presence&&p.presence.srv;if(s&&typeof s.c==='string')list.push(s);}}
 const last=S.lastServer,lj=S.lastJoin;
 w.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center">
 <button class="mbtn main" id="mpSingle">🧍 ${T('Einzelspieler','Singleplayer')}</button><button class="mbtn" id="mpPriv">🔒 ${T('Private Welt','Private world')}</button></div>
 <h3 style="color:#ffe08a;margin:14px 0 6px">🌐 ${T('Online spielen','Play online')}</h3>`+
 (ok?`<div class="row" style="display:block"><b>${T('Dein Name','Your name')}:</b> <input id="mpName" maxlength="16" value="${esc(S.char.name||'')}" placeholder="${T('Spieler','Player')}" style="font-family:inherit;font-size:16px;padding:6px 10px;border-radius:9px;border:1px solid #ffffff33;background:#ffffff14;color:#fff;width:170px"></div>
 <div class="row"><span>🖥️ <b>${T('Server erstellen','Create server')}</b><br><span style="color:#b9c4b2;font-size:13px">${T('Neue gemeinsame Welt. Du bist der Host.','New shared world. You are the host.')}</span></span><button class="btn" id="mpHost">${T('Erstellen','Create')}</button></div>
 ${last?`<div class="row"><span>♻️ ${T('Meinen Server wieder öffnen','Reopen my server')}: <b>${esc(last)}</b></span><button class="btn alt" id="mpReHost">${T('Öffnen','Open')}</button></div>`:''}
 <div class="row"><span>🔗 <b>${T('Server beitreten','Join server')}</b></span><form id="mpJoinF" style="display:flex;gap:6px"><input id="mpCode" maxlength="48" placeholder="z. B. palme-1234" value="${esc(lj||'')}" autocapitalize="off" style="font-family:inherit;font-size:16px;padding:6px 10px;border-radius:9px;border:1px solid #ffffff33;background:#ffffff14;color:#fff;width:150px"><button class="btn" type="submit">${T('Beitreten','Join')}</button></form></div>
 <h4 style="margin:12px 0 4px">📡 ${T('Offene Server','Open servers')} (${list.length})</h4>`+
 (list.length?list.map(s=>`<div class="row"><span>🏝️ <b>${esc(s.n||'?')}</b> · <code>${esc(s.c)}</code><br><span style="color:#b9c4b2;font-size:13px">👥 ${+s.p||1} · ${T('Tag','Day')} ${+s.d||1}</span></span><button class="btn" data-join="${esc(s.c)}">${T('Beitreten','Join')}</button></div>`).join(''):`<p style="color:#b9c4b2">${T('Gerade ist kein Server offen. Erstelle einen oder gib einen Code ein.','No server is open right now. Create one or enter a code.')}</p>`)+
 `<p style="color:#b9c4b2;font-size:12.5px">ℹ️ ${NET.dedicated?T('Du bist mit dem öffentlichen Spielserver verbunden. Welten laufen dauerhaft auf dem Server weiter – auch wenn niemand online ist. ','You are connected to the public game server. Worlds keep running on the server, even when nobody is online. '):T('Mitspielen kann jeder, mit dem du dieses Spiel auf claude.ai teilst (angemeldet).','Anyone you share this game with on claude.ai (signed in) can join.')} ${T('Synchronisiert werden Spieler, gefällte Bäume und abgebaute Rohstoffe, Gebäude, Truhen, Türen, Uhrzeit und Wetter. Inventar und Fortschritt bleiben pro Spieler. Tiere bewegen sich auf jedem Gerät eigenständig.','Anyone you share this game with on claude.ai (signed in) can join. Synced: players, felled trees and mined resources, buildings, chests, doors, time and weather. Inventory and progress stay per player. Animals move independently on each device.')}</p>`
 :`<p style="color:#ffb648">${T('Online-Spiel ist in dieser Ansicht nicht verfügbar. Öffne das Spiel angemeldet auf claude.ai (nicht über einen öffentlichen Link), dann kannst du Server erstellen und beitreten.','Online play is not available in this view. Open the game signed in on claude.ai (not via a public link) to create and join servers.')}</p>`);
 $('#mpSingle').onclick=()=>{closePanel();playFlow('main');};$('#mpPriv').onclick=()=>{closePanel();playFlow('private');};
 if(!ok)return;const nm=$('#mpName');nm.onchange=()=>{S.char.name=nm.value.trim().slice(0,16);saveSettings();};
 $('#mpHost').onclick=()=>{S.char.name=nm.value.trim().slice(0,16);saveSettings();closePanel();netHost(null,true);};
 const rh=$('#mpReHost');if(rh)rh.onclick=()=>{S.char.name=nm.value.trim().slice(0,16);saveSettings();closePanel();netHost(last,false);};
 $('#mpJoinF').onsubmit=e=>{e.preventDefault();S.char.name=nm.value.trim().slice(0,16);saveSettings();const c=$('#mpCode').value;closePanel();netJoin(c);};
 w.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>{S.char.name=nm.value.trim().slice(0,16);saveSettings();closePanel();netJoin(b.dataset.join);});}

/* ---------- WebSocket-Anbindung für den eigenen Spielserver (server.js) ---------- */
function wsLobby(){const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';let ws=null,open=false,myPeer=null,retry=0;const rooms=new Map();
 const send=o=>{if(open&&ws.readyState===1)ws.send(JSON.stringify(o));};
 function mk(name,opts){const st={name,opts,peers:new Map(),subs:[],me:{},snap:null,ready:null,res:null,rej:null};st.ready=new Promise((a,b)=>{st.res=a;st.rej=b;});
  const fire=(j,l)=>{st.snap=null;const ps=api.peers();for(const f of st.subs){try{f({peers:ps,joined:j||[],left:l||[],updated:[]});}catch(e){}}};st.fire=fire;
  const api={name,
   presence:async patch=>{for(const k in patch){if(patch[k]===null)delete st.me[k];else st.me[k]=patch[k];}st.snap=null;send({t:'pres',room:name,pr:st.me});},
   peers:()=>st.snap||(st.snap=Object.freeze([{peer:myPeer||'me',sameTab:true,isMe:true,presence:st.me},...[...st.peers].map(([peer,pr])=>({peer,sameTab:false,isMe:false,presence:pr}))])),
   onPeers:(f)=>{st.subs.push(f);setTimeout(()=>{try{f({peers:api.peers(),joined:api.peers(),left:[],updated:[]});}catch(e){}},0);return()=>{st.subs=st.subs.filter(x=>x!==f);};},
   on:()=>()=>{},emit:async()=>{},connected:()=>open,
   leave:async()=>{send({t:'leave',room:name});rooms.delete(name);},
   join:async(nm,o)=>{const r=mk(nm,o);rooms.set(nm,r);send({t:'join',room:nm,opt:o||null});const to=setTimeout(()=>r.rej(new Error(T('Server antwortet nicht','Server not responding'))),12000);try{await r.ready;}finally{clearTimeout(to);}return r.api;}};
  st.api=api;return st;}
 const lobby=mk('lobby');rooms.set('lobby',lobby);
 function connect(){ws=new WebSocket(url);
  ws.onopen=()=>{open=true;retry=0;for(const [n,r] of rooms){send({t:'join',room:n,opt:r.opts||null});if(Object.keys(r.me).length)send({t:'pres',room:n,pr:r.me});}};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}const r=rooms.get(m.room);
   if(m.t==='hello'){myPeer=m.peer;for(const rr of rooms.values())rr.snap=null;return;}
   if(!r)return;
   if(m.t==='joined'){r.peers=new Map(Object.entries(m.peers||{}));r.fire(r.api.peers().filter(p=>!p.sameTab));r.res();}
   else if(m.t==='err'){r.rej(new Error(m.msg||'error'));rooms.delete(m.room);}
   else if(m.t==='p'){const had=r.peers.has(m.peer);r.peers.set(m.peer,m.pr||{});r.snap=null;if(!had)r.fire(r.api.peers().filter(p=>p.peer===m.peer));}
   else if(m.t==='left'){if(r.peers.has(m.peer)){const pr=r.peers.get(m.peer);r.peers.delete(m.peer);r.fire([],[{peer:m.peer,sameTab:false,presence:pr}]);}}};
  ws.onclose=()=>{const was=open;open=false;if(was&&G.state==='play'&&NET.online)toast(T('Verbindung zum Server verloren – verbinde neu…','Lost connection – reconnecting…'),'#ffb648');retry++;setTimeout(connect,Math.min(10000,1000*retry));};
  ws.onerror=()=>{};}
 connect();const api=lobby.api;Object.defineProperty(api,'_ready',{value:lobby.ready});return api;}
boot();
</script>
